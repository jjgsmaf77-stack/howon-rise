{% extends "base.html" %}
{% block title %}오류 {{ code }}{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="login-logo">오류 {{ code }}</div>
    <h1>{% if code == 403 %}권한 없음{% elif code == 404 %}찾을 수 없음{% elif code == 422 %}입력 확인{% else %}처리 실패{% endif %}</h1>
    <div class="alert" style="margin-top:14px;text-align:left;">{{ message }}</div>
    <a class="btn ghost block" href="javascript:history.back()">← 돌아가기</a>
  </div>
</div>
{% endblock %}
